    <text x="76" y="124" font-size="64" font-weight="700" letter-spacing="-2.3" fill="#F5FCFC">MeetingRecord</text>
    <text x="80" y="180" font-size="27" fill="#C6DEDF">Capture the conversation.</text>
    <text x="80" y="216" font-size="27" fill="#C6DEDF">Keep the context.</text>
