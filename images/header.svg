<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">MeetingRecord — Native meeting notes for macOS</title>
  <desc id="desc">Capture the conversation. Keep the context. A waveform leads to a page of notes with source references.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="0.7"><stop stop-color="#0B1725"/><stop offset="1" stop-color="#10363D"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#28BDB6" stop-opacity="0.2"/><stop offset="1" stop-color="#28BDB6" stop-opacity="0"/></radialGradient>
    <linearGradient id="paper" x2="0.7" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDF3F0"/></linearGradient>
    <clipPath id="clip"><rect width="1200" height="350" rx="24"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="180%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#04141B" flood-opacity="0.3"/></filter>
  </defs>
